<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Target Triage</title>
<style>
:root{--bg:#f7f8f6;--ink:#1c2321;--mute:#66726d;--line:#dfe4e0;--card:#fff;--accent:#0f5c4d;--a:#0f5c4d;--b:#b7791f;--c:#9aa5a0}
@media(prefers-color-scheme:dark){:root{--bg:#141a18;--ink:#e6ece9;--mute:#93a29b;--line:#28322f;--card:#1b2320;--accent:#4fc3a6;--a:#4fc3a6;--b:#e0a63e;--c:#6b7873}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif}
main{max-width:1080px;margin:0 auto;padding:32px 20px}
h1{font-family:Georgia,"Iowan Old Style",serif;font-size:30px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 24px;max-width:60ch}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 12px}
button{cursor:pointer}button.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.msg{color:var(--mute);flex-basis:100%;min-height:22px}.msg.err{color:#c0392b}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line)}
th{font-weight:600;color:var(--mute);cursor:pointer;user-select:none}
tr.row{cursor:pointer}tr.row:hover{background:var(--bg)}
.score{display:flex;align-items:center;gap:10px;min-width:150px}
.track{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.fill{height:100%}.num{font-variant-numeric:tabular-nums;font-weight:600;width:28px}
.tier{font-weight:700}
.detail td{background:var(--bg);color:var(--mute)}.detail ul{margin:0;padding-left:18px}
.empty{padding:48px;text-align:center;color:var(--mute)}
.wrap{overflow-x:auto}
</style></head><body><main>
<h1>Target Triage</h1>
<p class="sub">Upload a company list and see which businesses are the strongest acquisition targets, with the reasons. Enrich the top of the list first.</p>
<div class="bar">
  <button class="primary" id="load">Load sample data</button>
  <button id="up">Upload CSV</button><input id="file" type="file" accept=".csv,text/csv" hidden>
  <select id="tier"><option value="">All tiers</option><option>A</option><option>B</option><option>C</option></select>
  <input id="q" type="search" placeholder="Search name, city, industry">
  <button id="exp">Export ranked CSV</button><button id="clr">Clear</button>
  <span class="msg" id="msg"></span>
</div>
<div class="wrap"><table><thead><tr>
  <th data-k="name">Company</th><th data-k="city">City</th><th data-k="industry">Industry</th><th data-k="score">Fit score</th><th data-k="tier">Tier</th>
</tr></thead><tbody id="body"></tbody></table></div>
<script>
let leads=[],sort={k:"score",d:-1},open=null;const $=id=>document.getElementById(id);
const say=t=>$("msg").textContent=t;
async function load(){leads=await (await fetch("/api/leads")).json();draw()}
function draw(){
  const q=$("q").value.toLowerCase(),t=$("tier").value;
  const rows=leads.filter(l=>(!t||l.tier===t)&&(!q||[l.name,l.city,l.industry].join(" ").toLowerCase().includes(q)))
    .sort((a,b)=>(a[sort.k]>b[sort.k]?1:-1)*sort.d);
  $("body").innerHTML=rows.length?rows.map((l,i)=>{
    const col=`var(--${l.tier.toLowerCase()})`;
    return `<tr class="row" data-i="${i}"><td>${esc(l.name)}</td><td>${esc(l.city||"")}</td><td>${esc(l.industry||"")}</td>
    <td><div class="score"><span class="num">${l.score}</span><div class="track"><div class="fill" style="width:${l.score}%;background:${col}"></div></div></div></td>
    <td class="tier" style="color:${col}">${l.tier}</td></tr>
    ${open===l.name?`<tr class="detail"><td colspan="5"><ul>${l.reasons.map(r=>`<li>${esc(r)}</li>`).join("")}</ul></td></tr>`:""}`}).join("")
    :`<tr><td colspan="5" class="empty">No targets yet. Load the sample data or upload a CSV.</td></tr>`;
  document.querySelectorAll("tr.row").forEach(tr=>tr.onclick=()=>{const n=rows[tr.dataset.i].name;open=open===n?null:n;draw()});
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
document.querySelectorAll("th").forEach(th=>th.onclick=()=>{const k=th.dataset.k;sort={k,d:sort.k===k?-sort.d:(k==="score"?-1:1)};draw()});
$("q").oninput=draw;$("tier").onchange=draw;
function report(r){const m=$("msg");m.className="msg"+(r.error?" err":"");
  m.textContent=r.error||`${r.imported} imported, ${r.duplicates_removed} duplicates removed`;
  $("tier").value="";$("q").value="";load()}
async function send(url,opts){try{const res=await fetch(url,opts);const r=await res.json();
  if(!res.ok)throw new Error(JSON.stringify(r.detail||r));report(r)}catch(e){report({error:"Upload failed: "+e.message})}}
$("load").onclick=()=>send("/api/sample",{method:"POST"});
$("up").onclick=()=>$("file").click();
$("file").onchange=async e=>{const f=e.target.files[0];if(!f)return;say("Importing "+f.name+"...");
  const csv=await f.text();e.target.value="";
  send("/api/import",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({csv})})};
$("exp").onclick=()=>location.href="/api/export";
$("clr").onclick=async()=>{await fetch("/api/leads",{method:"DELETE"});say("Cleared");load()};
load();
</script></main></body></html>
